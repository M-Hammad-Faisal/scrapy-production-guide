name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv --python 3.13 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Unit tests (offline, fixtures only)
        run: .venv/bin/python -m pytest -q
      # Live contract checks hit a real site, so run them on a schedule, not on every push:
      #   .venv/bin/scrapy check books

  integration:
    # Real PostgreSQL and MongoDB: the behaviours that matter differ per engine and cannot be mocked.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crawler
          POSTGRES_PASSWORD: crawler
          POSTGRES_DB: crawl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crawler -d crawl_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INTEGRATION_POSTGRES_URL: postgresql+psycopg://crawler:crawler@localhost:5432/crawl_test
      INTEGRATION_MONGO_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv --python 3.13 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Integration tests
        run: .venv/bin/python -m pytest tests/test_integration.py -v
